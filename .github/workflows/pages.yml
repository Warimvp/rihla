# Déploiement continu : chaque push sur main teste, construit et publie
# la version web sur GitHub Pages (https://warimvp.github.io/rihla/).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pas pnpm/setup : il exige pnpm 11+, le projet (et son lockfile v9) est en pnpm 9.
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Adresse du serveur de duels (serveur/) — variable de dépôt, facultative :
      # absente, l'app est bâtie 100 % hors-ligne, sans aucune carte « en ligne ».
      - run: pnpm build
        env:
          VITE_RIHLA_SERVEUR: ${{ vars.VITE_RIHLA_SERVEUR }}
      # Depuis v4, les fichiers cachés (.*) ne sont plus embarqués : dist n'en a pas.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
