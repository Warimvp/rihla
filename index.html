<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4E46C8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171210" />
    <meta name="description" content="Rihla — apprends les langues du monde, gratuitement, pour toujours. Sur les pas d'Ibn Battuta, de Tanger à Tokyo." />
    <!-- Aperçu d'un lien collé dans un message (WhatsApp, Telegram, X…) : les liens
         de défi et de salle (#barid=…, #salle=…) sont la diffusion de Rihla, et le
         fragment ne quitte pas le navigateur — l'aperçu est donc le même pour tous.
         og:image doit être ABSOLUE : c'est BASE_LIEN (src/lib/barid.js), comme les
         liens eux-mêmes ; src/lib/apercu.test.js garde l'accord, et que l'image existe. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rihla · رحلة" />
    <meta property="og:title" content="Rihla · رحلة — les langues du monde" />
    <meta property="og:description" content="Apprends les langues du monde, gratuitement, sur les pas d’Ibn Battuta. — تعلّم لغات العالم مجاناً، على خطى ابن بطوطة." />
    <meta property="og:image" content="https://warimvp.github.io/rihla/icons/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Rihla : une boussole au cœur d’une étoile de zellige, sur fond bleu Majorelle." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Safari iOS : bannière « Ouvrir / Obtenir » vers l'app de l'App Store (publiée le 21/09/2026).
         Sans effet dans l'app Capacitor elle-même (WKWebView l'ignore) ni hors Safari. -->
    <meta name="apple-itunes-app" content="app-id=6809222617" />
    <!-- Polices embarquées dans l'app : aucune requête réseau, la typo est
         identique en avion, dans le Rif et au premier lancement. -->
    <link rel="stylesheet" href="./polices/polices.css" />
    <!-- Avant la première image : le thème, la langue et la direction choisis.
         React ne les posait qu'APRÈS son premier rendu — un voyageur en mode
         nuit voyait un éclair de papier clair à chaque lancement, et
         l'interface arabe se dessinait une fois à l'endroit avant de se
         retourner. Mêmes clés et mêmes valeurs que App.jsx, qui reste le
         maître (src/lib/demarrage.test.js garde les deux d'accord).
         Puis les deux polices du premier écran sont demandées tout de suite :
         sans cela le navigateur ne les découvre qu'une fois l'app téléchargée
         et dessinée, et le texte change de police sous les yeux. -->
    <script>
      ;(function () {
        var racine = document.documentElement
        var langue = null
        try {
          var theme = localStorage.getItem('rihla.theme')
          if (theme === 'clair' || theme === 'sombre') racine.dataset.theme = theme
          langue = localStorage.getItem('rihla.langue')
        } catch (e) {
          // Stockage indisponible : thème du système, langue du téléphone.
        }
        // Jamais choisie : la langue du téléphone si c'est l'arabe, le français
        // sinon — la même règle que localeDuSysteme (src/i18n.js).
        if (langue !== 'fr' && langue !== 'ar') {
          var preferee = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase()
          langue = /^ar(-|$)/.test(preferee) ? 'ar' : 'fr'
        }
        if (langue === 'ar') {
          racine.lang = 'ar'
          racine.dir = 'rtl'
        }
        var polices = racine.lang === 'ar' ? ['amiri-4f1f7dad', 'readexpro-0136d09f'] : ['youngserif-1519d27a', 'readexpro-bf33cab6']
        for (var i = 0; i < polices.length; i++) {
          var lien = document.createElement('link')
          lien.rel = 'preload'
          lien.as = 'font'
          lien.type = 'font/woff2'
          // Exigé pour une police, même de la même origine : sans lui le
          // navigateur la télécharge deux fois.
          lien.crossOrigin = 'anonymous'
          lien.href = './polices/' + polices[i] + '.woff2'
          document.head.appendChild(lien)
        }
      })()
    </script>
    <title>Rihla — les langues du monde</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
